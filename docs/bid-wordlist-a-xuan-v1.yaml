# bid-wordlist-a-xuan-v1.yaml
# 给若兰 RFC v2 用 · 「可各自解释」阶段的阿轩自解释三要素
# 生成: 2026-10-19 · 全部数字来自本机实测，非估算

wordlist:
  version: a-xuan-v1
  owner: 阿轩
  basis: |
    语料 = /home/node/.openclaw/workspace/memory/ 258 个 md · 2158 个 ## 块
          时间跨度 2026-06-28 → 2026-10-19
    语体 = 工作指令语体（区别于若琢的汇报语体、若兰的日记语体）
    基线 = csb-memory v2.4 (81e22c1)，md5 32fe1230f4ba8a7e4aa73709368a9cd8
    实测 = 命中 139/2158 = 6.4%（correction 83 / decision 30 / promise 26）

  # ── 我的高频关系表达（频次为全库字面计数） ──
  signal_words:
    # 谓语位置 · 已覆盖
    - { word: 拍板,  freq: 1552, pos: 谓语, where: DECISION_STRICT(后接 =/：/了), status: covered }
    - { word: 授权,  freq: 2203, pos: 谓语, where: PEER_REL_POST,              status: covered }
    - { word: 指令,  freq: null, pos: 谓语, where: PEER_REL_POST,              status: covered }
    - { word: 误判,  freq: 99,   pos: 谓语, where: CORRECTION_OPS,             status: covered }
    - { word: 红线违反, freq: null, pos: 谓语, where: CORRECTION_OPS,          status: covered }
    - { word: 自纠,  freq: 9,    pos: 谓语, where: CORRECTION_OPS,             status: covered }
    - { word: 纠偏,  freq: 11,   pos: 谓语, where: CORRECTION_OPS,             status: covered }
    - { word: 复核,  freq: 86,   pos: 谓语, where: CORRECTION_OPS,             status: covered }

    # 宾语位置 · 不进词表（我上一轮报的频次表里有一半是这类，是陷阱）
    - { word: 红线,  freq: 944,  pos: 宾语, where: —,                          status: excluded_by_rule }
    - { word: 不擅自, freq: 2273, pos: 状语从句, where: —,                     status: excluded_pending }
      # ↑ 是约束表达不是事件动词，按谓语准入判据暂不收；但它的缺失已测到，见 known_misses

limits:
  # ── 已知抓不到（每条都有实测句子，非举例） ──
  known_misses:
    - { sentence: "不擅自推进，等墨白", result: MISS, why: 约束表达 2273 次，词表无对应事件动词 }
    - { sentence: "不擅自改 cron",      result: MISS, why: 同上 }
    - { sentence: "墨白点头了",          result: MISS, why: 口语化授权，PEER_REL_POST 只收书面动词 }
    - { sentence: "他同意了",            result: MISS, why: 同上 + 无 KNOWN_PEERS 主语 }
    - { sentence: "墨白让我删帖",        result: MISS, why: 指令语体「让」未收进任何表 }
    - { sentence: "已按墨白指令删除",    result: MISS, why: 「按X指令执行」是完成态，词表只认进行态 }
    - { sentence: "墨白 says OK",        result: MISS, why: 英文口语 }
  known_excluded_by_design:      # 不是 miss，是 v2.4 的有意决策，单列避免混淆
    - { sentence: "TODO: 修复 x",       result: MISS, why: v2.4 P0 promise 对象约束砍掉任务清单 }
    - { sentence: "待办：明早复核",      result: MISS, why: 同上 }
    - { sentence: "等墨白拍板 A/B/C",    result: MISS, why: v2.1 PENDING 待决排除，符合设计 }

  # ── 已知会误判（每条都有实测条数） ──
  known_fp:
    - { type: 方向性, evidence: "决策词在报告句【之后】→ 应判 decision 实测 null（'本次复验：全部通过。墨白拍板 = B: 1 小时一次。'）",
        impact: 按行口径统计，44 条被排除器拦掉的 decision 里 19 条属此类（决策词本行之前干净） }
    - { type: 方向性, evidence: "决策行行首有反引号 → null（'`config` 已确认。墨白拍板 = B: …'）",
        impact: 我 36% 的块含反引号代码，与日记语体差异最大的一条 }
    - { type: peer 噪音, evidence: "宏伟 1 条被判 peer，但该名来自 v2.2 扩名单，我从未与之打交道",
        impact: setSelf 只排除自己，不覆盖「名单里我不认识的人」 }
    - { type: 预防语境, evidence: "C10c '防止下次晨间自检再次误判' v2.3 已修（PREVENTIVE 护栏），v2.4 实测不再判",
        impact: 已修，但按通知要求保留为 known_fp（护栏可能仍有漏网） }

  self_consistency:              # 通知 ③ 三条的自证
    repeatable: ✅ 回填脚本 md5 0d1339077c26e1065bb198983dfec764 四轮未变，同版本重复跑结果一致
    hand_check_20pct: ⬜ 待做（139 条 × 20% ≈ 28 条人工判，与机器判一致率 ≥70%）
    known_not_flagged: ✅ known_excluded_by_design 3 条实测确为 MISS
